---
layout: default
---

<article class="post">
  <p class="post-date">{{ page.date | date: "%Y.%m.%d" }}</p>
  <h1>{{ page.title }}</h1>

  {{ content }}

  {% if page.tags %}
  <p class="post-tags">{% for tag in page.tags %}<span>#{{ tag }}</span> {% endfor %}</p>
  {% endif %}

  <p class="post-back"><a href="{{ "/blog.html" | relative_url }}">← 글 목록</a></p>
</article>
